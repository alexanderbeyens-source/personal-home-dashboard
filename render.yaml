services:
  - type: web
    name: northstar-dashboard
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: npm run server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: ALLOWED_GITHUB_ID
        sync: false
      - key: WEATHER_LAT
        sync: false
      - key: WEATHER_LON
        sync: false
      - key: WEATHER_LOCATION
        sync: false
      - key: CALENDAR_ICS_URL
        sync: false
      - key: HOME_ASSISTANT_URL
        sync: false
      - key: HOME_ASSISTANT_TOKEN
        sync: false
      - key: PROJECTS_JSON
        sync: false
