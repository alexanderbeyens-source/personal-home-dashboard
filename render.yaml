services:
  - type: web
    name: northstar-dashboard
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: ALLOWED_GITHUB_ID
        sync: false
      - key: WEATHER_LAT
        sync: false
      - key: WEATHER_LON
        sync: false
      - key: WEATHER_LOCATION
        sync: false
      - key: CALENDAR_ICS_URL
        sync: false
      - key: CALENDAR_ICS_URLS
        sync: false
      - key: HOME_ASSISTANT_URL
        sync: false
      - key: HOME_ASSISTANT_TOKEN
        sync: false
      - key: PROJECTS_JSON
        sync: false
      - key: GITHUB_TASKS_TOKEN
        sync: false
      - key: GITHUB_TASKS_REPO
        sync: false
      - key: GITHUB_TASKS_PATH
        sync: false
      - key: INTERVALS_ATHLETE_ID
        sync: false
      - key: INTERVALS_API_KEY
        sync: false
      - key: DUOLINGO_USERNAME
        sync: false
      - key: SMARTCAR_CLIENT_ID
        sync: false
      - key: SMARTCAR_CLIENT_SECRET
        sync: false
      - key: SMARTCAR_REDIRECT_URI
        sync: false
